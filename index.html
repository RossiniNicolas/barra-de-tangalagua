              <div className="grid grid-cols-2 gap-3">
                <input type="text" required placeholder="Categoría" value={category} onChange={(e) => setCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                <input type="number" required placeholder="Precio ($)" value={price} onChange={(e) => setPrice(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono" />
              </div>

              <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
                <span className="font-bold text-white">Ingredientes & Descuento en CC:</span>
                {ingredients.map((ing, idx) => (
                  <div key={idx} className="flex gap-2">
                    <select
                      value={ing.inventoryId}
                      onChange={(e) => {
                        const it = inventory.find((x) => x.id === e.target.value);
                        setIngredients(ingredients.map((item, i) => i === idx ? { ...item, inventoryId: e.target.value, name: it?.name || '' } : item));
                      }}
                      className="flex-1 bg-slate-900 border border-slate-800 text-white rounded-xl px-2 py-1 text-xs"
                    >
                      {inventory.map((inv) => <option key={inv.id} value={inv.id}>{inv.name}</option>)}
                    </select>
                    <input
                      type="number"
                      value={ing.cc}
                      onChange={(e) => setIngredients(ingredients.map((item, i) => i === idx ? { ...item, cc: e.target.value } : item))}
                      className="w-20 bg-slate-900 border border-slate-800 text-white text-right rounded-xl px-2 py-1 font-mono text-purple-300 font-bold"
                    />
                    <span className="text-slate-500 self-center">cc</span>
                  </div>
                ))}
              </div>

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                <button type="submit" className="flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-black shadow-lg">Guardar Receta</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // ============================= INVENTORY VIEW ============================
    // =========================================================================
    function InventoryView({ inventory, salesHistory, recipes, purchases, criticalItems, onOpenRestockModal, onUpdateStock }) {
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');
      const [adjustItem, setAdjustItem] = useState(null);
      const [adjustMl, setAdjustMl] = useState('');

      // 1. Calcular el consumo real en barra de cada insumo (en cc) según recetas y ventas
      const consumedByItem = useMemo(() => {
        const map = {};
        salesHistory.forEach((sale) => {
          sale.items.forEach((saleItem) => {
            const recipe = recipes.find((r) => r.name === saleItem.name);
            if (recipe) {
              recipe.ingredients.forEach((ing) => {
                map[ing.inventoryId] = (map[ing.inventoryId] || 0) + (ing.cc * saleItem.qty);
              });
            }
          });
        });
        return map;
      }, [salesHistory, recipes]);

      // 2. Consolidar productos directamente desde FACTURACIÓN Y COMPRAS
      const purchasedProducts = useMemo(() => {
        const map = {};

        purchases.forEach((p) => {
          p.items.forEach((it) => {
            const key = it.inventoryId || it.name;
            if (!map[key]) {
              // Buscar metadatos existentes en inventory o asignar defaults
              const meta = inventory.find((inv) => inv.id === it.inventoryId || inv.name.toLowerCase() === it.name.toLowerCase());
              map[key] = {
                id: it.inventoryId || key,
                name: it.name,
                category: meta?.category || 'Bebidas',
                bottleSizeMl: it.bottleSizeMl || meta?.bottleSizeMl || 750,
                costPerBottle: it.costPerBottle || (it.bottles > 0 ? Math.round(it.cost / it.bottles) : meta?.costPerBottle || 0),
                minAlertMl: meta?.minAlertMl || (it.bottleSizeMl ? it.bottleSizeMl * 3 : 2500),
                totalPurchasedMl: 0,
                totalBottlesPurchased: 0,
                invoicesCount: 0
              };
            }
            map[key].totalPurchasedMl += it.addedMl || (it.bottles * (it.bottleSizeMl || 750));
            map[key].totalBottlesPurchased += it.bottles;
            map[key].invoicesCount += 1;
          });
        });

        // Si hay insumos en catálogo que aún no tienen factura cargada, incorporarlos como referencia
        inventory.forEach((inv) => {
          if (!map[inv.id]) {
            map[inv.id] = {
              id: inv.id,
              name: inv.name,
              category: inv.category,
              bottleSizeMl: inv.bottleSizeMl,
              costPerBottle: inv.costPerBottle,
              minAlertMl: inv.minAlertMl,
              totalPurchasedMl: inv.currentStockMl || 0,
              totalBottlesPurchased: Math.round((inv.currentStockMl || 0) / inv.bottleSizeMl),
              invoicesCount: 0
            };
          }
        });

        // Calcular Stock Disponible: Comprado según facturas - Consumido en ventas
        return Object.values(map).map((prod) => {
          const consumedCc = consumedByItem[prod.id] || 0;
          const availableMl = Math.max(0, prod.totalPurchasedMl - consumedCc);
          const availableBottles = prod.bottleSizeMl > 0 ? (availableMl / prod.bottleSizeMl).toFixed(1) : '0';
          const isCritical = availableMl <= prod.minAlertMl;

          return {
            ...prod,
            consumedCc,
            availableMl,
            availableBottles,
            isCritical
          };
        });
      }, [purchases, inventory, consumedByItem]);

      const categories = useMemo(() => {
        const s = new Set();
        purchasedProducts.forEach((i) => s.add(i.category));
        return ['ALL', ...Array.from(s)];
      }, [purchasedProducts]);

      const filteredProducts = useMemo(() => {
        return purchasedProducts.filter((item) => {
          if (filterCategory !== 'ALL' && item.category !== filterCategory) return false;
          if (searchTerm && !item.name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
          return true;
        });
      }, [purchasedProducts, filterCategory, searchTerm]);

      const totalCcAvailable = useMemo(() => purchasedProducts.reduce((acc, i) => acc + i.availableMl, 0), [purchasedProducts]);
      const totalPurchasedCcAll = useMemo(() => purchasedProducts.reduce((acc, i) => acc + i.totalPurchasedMl, 0), [purchasedProducts]);
      const totalConsumedCcAll = useMemo(() => purchasedProducts.reduce((acc, i) => acc + i.consumedCc, 0), [purchasedProducts]);
      const totalValuation = useMemo(
        () => purchasedProducts.reduce((acc, i) => acc + (i.bottleSizeMl > 0 ? (i.availableMl / i.bottleSizeMl) * i.costPerBottle : 0), 0),
        [purchasedProducts]
      );
      const criticalCount = useMemo(() => purchasedProducts.filter((p) => p.isCritical).length, [purchasedProducts]);

      const handleConfirmAdjust = (e) => {
        e.preventDefault();
        const delta = parseFloat(adjustMl);
        if (adjustItem && !isNaN(delta)) {
          onUpdateStock(adjustItem.id, delta);
          setAdjustItem(null);
          setAdjustMl('');
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 className="text-2xl font-black text-white">Control de Stock Milimétrico (cc)</h2>
              <p className="text-xs text-slate-400">
                Productos tomados de Facturación & Compras menos consumo acumulado en barra = Stock Disponible
              </p>
            </div>
            <button onClick={onOpenRestockModal} className="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-black text-xs shadow-lg flex items-center gap-2">
              <Icons.Plus className="w-4 h-4" /> Ingreso de Stock / Factura
            </button>
          </div>

          {/* KPI Cards de Stock Disponible según Facturación */}
          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <div className="text-slate-400 text-xs font-semibold mb-1">Comprado en Facturas</div>
              <div className="text-2xl font-black text-cyan-400 font-mono">
                {(totalPurchasedCcAll / 1000).toFixed(1)} <span className="text-sm font-normal text-slate-400">Litros</span>
              </div>
              <div className="text-[10px] text-slate-500 mt-1">{totalPurchasedCcAll.toLocaleString('es-AR')} cc ingresados</div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <div className="text-slate-400 text-xs font-semibold mb-1">Consumo en Barras</div>
              <div className="text-2xl font-black text-rose-400 font-mono">
                -{(totalConsumedCcAll / 1000).toFixed(1)} <span className="text-sm font-normal text-slate-400">Litros</span>
              </div>
              <div className="text-[10px] text-slate-500 mt-1">{totalConsumedCcAll.toLocaleString('es-AR')} cc descontados</div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <div className="text-slate-400 text-xs font-semibold mb-1">Stock Disponible Actual</div>
              <div className="text-2xl font-black text-emerald-400 font-mono">
                {(totalCcAvailable / 1000).toFixed(1)} <span className="text-sm font-normal text-slate-400">Litros</span>
              </div>
              <div className="text-[10px] text-slate-500 mt-1">{totalCcAvailable.toLocaleString('es-AR')} cc disponibles para venta</div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <div className="text-slate-400 text-xs font-semibold mb-1">Valorización Remanente</div>
              <div className="text-2xl font-black text-purple-400 font-mono">
                ${Math.round(totalValuation).toLocaleString('es-AR')}
              </div>
              <div className="text-[10px] text-slate-500 mt-1">{criticalCount > 0 ? `${criticalCount} productos en alerta` : 'Stock en niveles óptimos'}</div>
            </div>
          </div>

          {/* Filtros */}
          <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-900 p-2.5 rounded-2xl border border-slate-800">
            <div className="flex gap-1 overflow-x-auto">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setFilterCategory(cat)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${filterCategory === cat ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  {cat === 'ALL' ? 'Todos los Productos Comprados' : cat}
                </button>
              ))}
            </div>
            <input
              type="text"
              placeholder="Buscar producto comprado..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white outline-none focus:border-purple-500 font-sans"
            />
          </div>

          {/* Grilla de Tarjetas: Productos Comprados - Consumido = Disponible */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {filteredProducts.map((prod) => {
              const maxRef = Math.max(prod.totalPurchasedMl, prod.bottleSizeMl * 2);
              const availablePct = Math.min(100, Math.round((prod.availableMl / maxRef) * 100));

              return (
                <div key={prod.id} className={`bg-slate-900 border rounded-2xl p-4 flex flex-col justify-between space-y-3 ${prod.isCritical ? 'border-rose-700/60 shadow-lg shadow-rose-950/40' : 'border-slate-800'}`}>
                  <div>
                    <div className="flex justify-between items-start mb-1">
                      <div>
                        <h3 className="font-bold text-white text-sm">{prod.name}</h3>
                        <span className="text-[10px] text-slate-400 font-semibold">{prod.category} &bull; {prod.bottleSizeMl}cc/bot.</span>
                      </div>
                      {prod.isCritical && (
                        <span className="px-1.5 py-0.5 rounded text-[9px] font-black bg-rose-500/20 text-rose-400 border border-rose-500/30 animate-pulse">
                          STOCK BAJO
                        </span>
                      )}
                    </div>

                    {/* Stock Disponible (Comprado - Consumido) */}
                    <div className="mt-2 space-y-1 font-mono">
                      <div className="flex items-baseline justify-between">
                        <span className="text-2xl font-black text-emerald-400">{prod.availableMl.toLocaleString('es-AR')}</span>
                        <span className="text-xs text-slate-400 font-semibold">cc disponibles</span>
                      </div>
                      <div className="text-xs font-bold text-purple-300">
                        ~ {prod.availableBottles} botellas disponibles
                      </div>
                    </div>

                    {/* Barra de progreso de disponibilidad */}
                    <div className="mt-2.5">
                      <div className="flex justify-between text-[10px] font-mono text-slate-400 mb-1">
                        <span>Disponibilidad</span>
                        <span className={prod.isCritical ? 'text-rose-400 font-bold' : 'text-emerald-400 font-bold'}>{availablePct}%</span>
                      </div>
                      <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                        <div
                          className={`h-full rounded-full transition-all duration-300 ${prod.isCritical ? 'bg-gradient-to-r from-rose-600 to-amber-500' : 'bg-gradient-to-r from-emerald-500 to-teal-400'}`}
                          style={{ width: `${availablePct}%` }}
                        />
                      </div>
                    </div>

                    {/* Desglose: Comprado en Facturas vs Consumido en Barra */}
                    <div className="mt-3 pt-2.5 border-t border-slate-800/80 space-y-1.5 text-[11px] font-mono">
                      <div className="flex justify-between text-slate-400">
                        <span>Comprado (Facturas):</span>
                        <span className="text-cyan-400 font-bold">+{prod.totalPurchasedMl.toLocaleString('es-AR')} cc ({prod.totalBottlesPurchased} bot.)</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>Consumo en Ventas:</span>
                        <span className="text-rose-400 font-bold">-{prod.consumedCc.toLocaleString('es-AR')} cc</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>Alerta Mínima:</span>
                        <span className="text-slate-300 font-bold">{prod.minAlertMl} cc</span>
                      </div>
                      {prod.costPerBottle > 0 && (
                        <div className="flex justify-between text-slate-400">
                          <span>Costo Unitario:</span>
                          <span className="text-white font-bold">${prod.costPerBottle.toLocaleString('es-AR')}/u</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Acciones de Ajuste Rápido */}
                  <div className="pt-2 border-t border-slate-800 flex gap-2">
                    <button
                      onClick={() => setAdjustItem(prod)}
                      className="flex-1 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-[11px] flex items-center justify-center gap-1 transition-all"
                    >
                      <Icons.Edit3 className="w-3.5 h-3.5" /> Ajustar cc
                    </button>
                    <button
                      onClick={() => onUpdateStock(prod.id, prod.bottleSizeMl)}
                      className="px-2.5 py-1.5 rounded-xl bg-purple-600/30 hover:bg-purple-600 text-purple-300 hover:text-white font-bold text-[11px] border border-purple-800/50 transition-all"
                      title="Sumar 1 botella completa"
                    >
                      +1 Bot.
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Modal Ajuste Rápido de Stock en CC */}
          {adjustItem && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
                <div>
                  <h3 className="text-base font-black text-white">Ajuste de Stock Disponible</h3>
                  <p className="text-xs text-slate-400">{adjustItem.name} &bull; Disponible: {adjustItem.availableMl} cc</p>
                </div>
                <form onSubmit={handleConfirmAdjust} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Variación en Centímetros Cúbicos (cc)</label>
                    <input
                      type="number"
                      step="10"
                      required
                      autoFocus
                      value={adjustMl}
                      onChange={(e) => setAdjustMl(e.target.value)}
                      placeholder="Ej: +750 (ingreso) o -100 (merma/rotura)"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono text-sm outline-none focus:border-purple-500"
                    />
                    <div className="flex gap-1.5 mt-2">
                      <button type="button" onClick={() => setAdjustMl(`-${adjustItem.bottleSizeMl}`)} className="px-2 py-1 bg-slate-800 rounded text-[10px] text-rose-300 font-mono">-1 Botella</button>
                      <button type="button" onClick={() => setAdjustMl(`+${adjustItem.bottleSizeMl}`)} className="px-2 py-1 bg-slate-800 rounded text-[10px] text-emerald-300 font-mono">+1 Botella</button>
                      <button type="button" onClick={() => setAdjustMl('-250')} className="px-2 py-1 bg-slate-800 rounded text-[10px] text-amber-300 font-mono">-250cc (Merma)</button>
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setAdjustItem(null)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-black shadow-lg">Aplicar Ajuste</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // ============================= CASHIER POS VIEW ==========================
    // =========================================================================
    function CashierPosView({
      activeCashier,
      salesHistory,
      recipes,
      inventory,
      cart,
      onAddToCart,
      onRemoveFromCart,
      onDeleteItemFromCart,
      onClearCart,
      onProcessSale,
      autoPrint,
      onToggleAutoPrint,
      ticketFormat,
      onChangeTicketFormat,
      onOpenCloseCashModal
    }) {
      const [showSummaryDrawer, setShowSummaryDrawer] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      const mySales = useMemo(() => salesHistory.filter((s) => s.cashierId === activeCashier.id), [salesHistory, activeCashier]);
      const accumulatedCash = useMemo(() => mySales.filter((s) => s.paymentMethod === 'EFECTIVO').reduce((acc, s) => acc + s.total, 0), [mySales]);
      const accumulatedQr = useMemo(() => mySales.filter((s) => s.paymentMethod === 'MERCADO_PAGO').reduce((acc, s) => acc + s.total, 0), [mySales]);
      const accumulatedCard = useMemo(() => mySales.filter((s) => s.paymentMethod === 'TARJETA').reduce((acc, s) => acc + s.total, 0), [mySales]);
      const totalShiftSales = accumulatedCash + accumulatedQr + accumulatedCard;
      const inDrawerPhysicalCash = accumulatedCash + (activeCashier.initialCash || 0);
      const cartTotal = useMemo(() => cart.reduce((acc, it) => acc + it.price * it.qty, 0), [cart]);

      const categories = useMemo(() => {
        const set = new Set();
        recipes.forEach((r) => set.add(r.category));
        return ['ALL', ...Array.from(set)];
      }, [recipes]);

      const filteredRecipes = useMemo(() => {
        if (selectedCategory === 'ALL') return recipes;
        return recipes.filter((r) => r.category === selectedCategory);
      }, [recipes, selectedCategory]);

      return (
        <div className="flex-1 flex flex-col md:flex-row overflow-hidden bg-slate-950">
          <div className="flex-1 flex flex-col overflow-hidden border-r border-slate-800">
            <div className="p-3 bg-slate-900 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
              <div className="flex items-center gap-2">
                <span className="font-bold text-sm text-white">{activeCashier.station}</span>
                <span className="text-xs text-slate-400">({activeCashier.name})</span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowSummaryDrawer((prev) => !prev)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-emerald-400 border border-slate-700"
                >
                  <Icons.Wallet className="w-3.5 h-3.5" />
                  <span>Resumen: ${totalShiftSales.toLocaleString('es-AR')}</span>
                  {showSummaryDrawer ? <Icons.ChevronUp className="w-3.5 h-3.5" /> : <Icons.ChevronDown className="w-3.5 h-3.5" />}
                </button>
                <button
                  onClick={onOpenCloseCashModal}
                  className="px-3 py-1.5 rounded-xl bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-600/40 text-xs font-bold transition-all"
                >
                  Cierre de Turno
                </button>
              </div>
            </div>

            {showSummaryDrawer && (
              <div className="p-4 bg-slate-900/95 border-b border-slate-800 grid grid-cols-2 sm:grid-cols-4 gap-3 shrink-0">
                <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                  <div className="text-[10px] text-slate-400 font-semibold">En Cajón (Físico)</div>
                  <div className="text-base font-black text-emerald-400 font-mono">${inDrawerPhysicalCash.toLocaleString('es-AR')}</div>
                </div>
                <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                  <div className="text-[10px] text-slate-400 font-semibold">MercadoPago / QR</div>
                  <div className="text-base font-black text-cyan-400 font-mono">${accumulatedQr.toLocaleString('es-AR')}</div>
                </div>
                <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                  <div className="text-[10px] text-slate-400 font-semibold">Tarjetas / Débito</div>
                  <div className="text-base font-black text-purple-400 font-mono">${accumulatedCard.toLocaleString('es-AR')}</div>
                </div>
                <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                  <div className="text-[10px] text-slate-400 font-semibold">Total Turno</div>
                  <div className="text-base font-black text-white font-mono">${totalShiftSales.toLocaleString('es-AR')}</div>
                </div>
              </div>
            )}

            <div className="p-3 flex gap-1.5 overflow-x-auto shrink-0 bg-slate-950/60 border-b border-slate-850">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${selectedCategory === cat ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}`}
                >
                  {cat === 'ALL' ? 'Todos los Tragos' : cat}
                </button>
              ))}
            </div>

            <div className="flex-1 overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
              {filteredRecipes.map((recipe) => (
                <button
                  key={recipe.id}
                  onClick={() => onAddToCart(recipe)}
                  className="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-purple-500 text-left flex flex-col justify-between active:scale-95 transition-all shadow-lg"
                >
                  <div>
                    <div className="text-[10px] font-bold text-purple-400 uppercase tracking-wider mb-1">{recipe.category}</div>
                    <h4 className="font-bold text-white text-sm">{recipe.name}</h4>
                  </div>
                  <div className="mt-3 flex justify-between items-end">
                    <span className="text-xs text-slate-400 font-mono">{recipe.ingredients.reduce((a, b) => a + b.cc, 0)}cc</span>
                    <span className="font-black text-emerald-400 font-mono text-base">${recipe.price.toLocaleString('es-AR')}</span>
                  </div>
                </button>
              ))}
            </div>
          </div>

          <div className="w-full md:w-96 bg-slate-900 flex flex-col shrink-0">
            <div className="p-4 border-b border-slate-800 flex justify-between items-center">
              <div>
                <h3 className="font-black text-white text-base">Comanda Activa</h3>
                <p className="text-[11px] text-slate-400">{cart.length} ítems cargados</p>
              </div>
              {cart.length > 0 && (
                <button onClick={onClearCart} className="text-xs text-rose-400 hover:text-rose-300 font-bold">Vaciar</button>
              )}
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-2">
              {cart.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-slate-500 text-xs">
                  <Icons.ShoppingCart className="w-8 h-8 mb-2" />
                  <span>Seleccioná tragos para cobrar</span>
                </div>
              ) : (
                cart.map((item) => (
                  <div key={item.id} className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                    <div className="flex-1 pr-2">
                      <div className="font-bold text-white text-xs">{item.name}</div>
                      <div className="text-[10px] text-emerald-400 font-mono">${(item.price * item.qty).toLocaleString('es-AR')}</div>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded-lg border border-slate-800">
                        <button onClick={() => onRemoveFromCart(item.id)} className="text-slate-400 font-bold px-1">-</button>
                        <span className="font-mono font-bold text-xs text-white min-w-[16px] text-center">{item.qty}</span>
                        <button onClick={() => onAddToCart(item)} className="text-slate-400 font-bold px-1">+</button>
                      </div>
                      <button onClick={() => onDeleteItemFromCart(item.id)} className="p-1.5 rounded-lg text-slate-500 hover:text-rose-400" title="Eliminar"><Icons.Trash2 className="w-4 h-4" /></button>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className="p-4 bg-slate-950 border-t border-slate-800 space-y-3">
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-400 flex items-center gap-1.5 font-bold"><Icons.Printer className="w-3.5 h-3.5" /> Auto-Imprimir</span>
                <div className="flex items-center gap-2">
                  <select value={ticketFormat} onChange={(e) => onChangeTicketFormat(e.target.value)} className="bg-slate-900 text-slate-300 text-[10px] border border-slate-800 rounded px-1.5 py-0.5 outline-none font-bold">
                    <option value="80mm">80mm</option>
                    <option value="58mm">58mm</option>
                  </select>
                  <button onClick={onToggleAutoPrint} className={`w-9 h-5 rounded-full relative transition-colors ${autoPrint ? 'bg-purple-600' : 'bg-slate-800'}`}>
                    <div className={`w-3.5 h-3.5 rounded-full bg-white absolute top-0.5 transition-transform ${autoPrint ? 'translate-x-4' : 'translate-x-1'}`} />
                  </button>
                </div>
              </div>

              <div className="flex justify-between items-baseline pt-1">
                <span className="text-xs text-slate-400 font-bold uppercase">Total a Cobrar</span>
                <span className="text-2xl font-black text-white font-mono">${cartTotal.toLocaleString('es-AR')}</span>
              </div>

              <div className="grid grid-cols-3 gap-2">
                <button disabled={cart.length === 0} onClick={() => onProcessSale('EFECTIVO')} className="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-black text-xs flex flex-col items-center justify-center gap-1 shadow-lg">
                  <Icons.Banknote className="w-4 h-4" /><span>Efectivo</span>
                </button>
                <button disabled={cart.length === 0} onClick={() => onProcessSale('MERCADO_PAGO')} className="py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 text-white font-black text-xs flex flex-col items-center justify-center gap-1 shadow-lg">
                  <Icons.QrCode className="w-4 h-4" /><span>MercadoPago</span>
                </button>
                <button disabled={cart.length === 0} onClick={() => onProcessSale('TARJETA')} className="py-3 rounded-xl bg-purple-600 hover:bg-purple-500 disabled:opacity-40 text-white font-black text-xs flex flex-col items-center justify-center gap-1 shadow-lg">
                  <Icons.CreditCard className="w-4 h-4" /><span>Tarjeta</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CloseCashModal({ cashier, salesHistory, onClose }) {
      const cashSales = salesHistory.filter((s) => s.paymentMethod === 'EFECTIVO').reduce((acc, s) => acc + s.total, 0);
      const qrSales = salesHistory.filter((s) => s.paymentMethod === 'MERCADO_PAGO').reduce((acc, s) => acc + s.total, 0);
      const cardSales = salesHistory.filter((s) => s.paymentMethod === 'TARJETA').reduce((acc, s) => acc + s.total, 0);
      const totalSales = cashSales + qrSales + cardSales;
      const inDrawer = cashSales + cashier.initialCash;

      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
            <h3 className="text-base font-black text-white">Arqueo & Cierre de Caja</h3>
            <p className="text-xs text-slate-400">{cashier.name} &bull; {cashier.station}</p>
            <div className="space-y-2 p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono">
              <div className="flex justify-between text-slate-400"><span>Fondo Inicial:</span><span>${cashier.initialCash.toLocaleString('es-AR')}</span></div>
              <div className="flex justify-between text-slate-400"><span>Ventas Efectivo:</span><span>${cashSales.toLocaleString('es-AR')}</span></div>
              <div className="flex justify-between text-cyan-400"><span>Ventas MercadoPago:</span><span>${qrSales.toLocaleString('es-AR')}</span></div>
              <div className="flex justify-between text-purple-400"><span>Ventas Tarjeta:</span><span>${cardSales.toLocaleString('es-AR')}</span></div>
              <div className="border-t border-slate-800 pt-2 flex justify-between text-sm font-black text-white"><span>TOTAL VENTAS:</span><span>${totalSales.toLocaleString('es-AR')}</span></div>
              <div className="border-t border-slate-800 pt-2 flex justify-between text-sm font-black text-emerald-400"><span>EFECTIVO A ENTREGAR:</span><span>${inDrawer.toLocaleString('es-AR')}</span></div>
            </div>
            <div className="flex gap-2">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Volver</button>
              <button onClick={() => { window.print(); onClose(); }} className="flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-black text-xs shadow-lg flex items-center justify-center gap-1.5">
                <Icons.Printer className="w-3.5 h-3.5" /> Imprimir Cierre
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // ============================ MOUNT REACT APP ============================
    // =========================================================================
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
