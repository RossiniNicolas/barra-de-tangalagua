    const syncLiveCollection = async (collectionKey, items) => {
      try {
        let docRef = null;
        if (collectionKey === 'sales') {
          docRef = db.collection('tickets').doc('tangalagua_pos_sales');
        } else if (collectionKey === 'events') {
          docRef = db.collection('events').doc('tangalagua_active_events');
        } else {
          docRef = db.collection('settings').doc(`tangalagua_${collectionKey}`);
        }

        await docRef.set({
          items: items || [],
          updatedAt: new Date().toISOString()
        }, { merge: true });
        console.log(`✓ Firestore guardado en [${docRef.path}] exitoso`);
      } catch (err) {
        console.warn(`Aviso de permisos al guardar [${collectionKey}]:`, err.message);
      }
    };

      CheckCircle2: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />,
      AlertTriangle: (props) => <Icon {...props} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
      Wallet: (props) => <Icon {...props} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
      ChevronDown: (props) => <Icon {...props} path={<><polyline points="6 9 12 15 18 9"/></>} />,
      ChevronUp: (props) => <Icon {...props} path={<><polyline points="18 15 12 9 6 15"/></>} />,
      ShoppingCart: (props) => <Icon {...props} path={<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>} />,
      Banknote: (props) => <Icon {...props} path={<><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01m11.99 0h.01"/></>} />,
      QrCode: (props) => <Icon {...props} path={<><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></>} />,
      CreditCard: (props) => <Icon {...props} path={<><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></>} />,
      KeyRound: (props) => <Icon {...props} path={<><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5"/></>} />,
      RefreshCw: (props) => <Icon {...props} path={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>} />,
      Info: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>} />
    };

    // =========================================================================
    // ========================== INITIAL DATA =================================
    // =========================================================================
    const INITIAL_INVENTORY = [];

    const INITIAL_RECIPES = [];

    const INITIAL_CASHIERS = [];

    const INITIAL_EVENTS = [];

    // =========================================================================
    // ===================== RUTINAS DE TICKET TÉRMICO =========================
    // =========================================================================
    function generateTicketHtml(sale, format = '80mm') {
      const widthStyle = format === '58mm' ? 'max-w-[48mm] w-[48mm]' : 'max-w-[72mm] w-[72mm]';
      return (
        <div className={`ticket-print-area font-mono text-[11px] leading-snug text-black bg-white p-2 mx-auto ${widthStyle}`}>
          <div className="text-center">
            <div className="font-black text-sm uppercase tracking-wider">TANGALAGUA</div>
            <div className="text-[10px]">BAR & DRINKS MANAGEMENT</div>
            <div className="text-[10px] mt-1">Fecha: {sale.date} {sale.timestamp}</div>
            <div className="text-[10px]">Barra: {sale.station}</div>
            <div className="text-[10px]">Cajero: {sale.cashierName}</div>
            <div className="border-t border-dashed border-black my-1.5" />
            <div className="text-[10px] font-bold">ORDEN DE DESPACHO</div>
            <div className="text-2xl font-black my-1"># {sale.ticketNumber}</div>
          </div>

          <div className="border-t border-dashed border-black my-1.5" />
          <div className="flex justify-between font-bold text-[10px]">
            <span>CANT / ARTICULO</span>
            <span>IMPORTE</span>
          </div>
          <div className="border-t border-dashed border-black my-1" />

          {sale.items.map((item, idx) => (
            <div key={idx} className="my-1">
              <div className="flex justify-between">
                <span className="font-bold">{item.qty}x {item.name}</span>
                <span>${(item.price * item.qty).toLocaleString('es-AR')}</span>
              </div>
              {item.ingredientsSummary && (
                <div className="text-[9px] text-gray-700 pl-2">↳ Insumos: {item.ingredientsSummary}</div>
              )}
            </div>
          ))}

          <div className="border-t border-dashed border-black my-1.5" />
          <div className="flex justify-between font-black text-sm">
            <span>TOTAL:</span>
            <span>${sale.total.toLocaleString('es-AR')}</span>
          </div>
          <div className="flex justify-between text-[10px] mt-0.5">
            <span>Forma de Pago:</span>
            <span className="font-bold">{sale.paymentMethod}</span>
          </div>
          <div className="border-t border-dashed border-black my-2" />
          <div className="text-center mt-1">
            <div className="font-bold text-xs uppercase">CANJEAR EN BARRA</div>
            <div className="text-[8px] text-gray-600">Válido únicamente para la noche de emisión</div>
            <div className="tracking-widest mt-1 font-bold text-[10px]">* {sale.id} *</div>
          </div>
        </div>
      );
    }

    function triggerThermalPrint(sale, format = '80mm') {
      try {
        const widthMm = format === '58mm' ? '48mm' : '72mm';
        const printContent = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Ticket #${sale.ticketNumber} - TANGALAGUA</title>
            <style>
              @page { size: auto; margin: 0; }
              body {
                margin: 0;
                padding: 4px;
                font-family: 'Courier New', Courier, monospace;
                font-size: 11px;
                line-height: 1.25;
                color: #000;
                background: #fff;
                width: ${widthMm};
                max-width: ${widthMm};
              }
              .text-center { text-align: center; }
              .bold { font-weight: bold; }
              .divider { border-top: 1px dashed #000; margin: 4px 0; }
              .row { display: flex; justify-content: space-between; margin: 2px 0; }
              .big-ticket { font-size: 22px; font-weight: 900; margin: 3px 0; text-align: center; }
              .ingredients { font-size: 9px; color: #444; padding-left: 6px; }
            </style>
          </head>
          <body>
            <div class="text-center">
              <div class="bold" style="font-size:15px; text-transform:uppercase;">TANGALAGUA</div>
              <div style="font-size:10px;">BAR & DRINKS MANAGEMENT</div>
              <div style="font-size:10px; margin-top:2px;">Fecha: ${sale.date} ${sale.timestamp}</div>
              <div style="font-size:10px;">Barra: ${sale.station}</div>
              <div style="font-size:10px;">Cajero: ${sale.cashierName}</div>
              <div class="divider"></div>
              <div style="font-size:10px; font-weight:bold;">ORDEN DE DESPACHO</div>
              <div class="big-ticket"># ${sale.ticketNumber}</div>
            </div>
            <div class="divider"></div>
            <div class="row bold" style="font-size:10px;">
              <span>CANT / ARTICULO</span>
              <span>IMPORTE</span>
            </div>
            <div class="divider"></div>
            ${sale.items.map((item) => `
              <div>
                <div class="row">
                  <span class="bold">${item.qty}x ${item.name}</span>
                  <span>$${(item.price * item.qty).toLocaleString('es-AR')}</span>
                </div>
                ${item.ingredientsSummary ? `<div class="ingredients">↳ Insumos: ${item.ingredientsSummary}</div>` : ''}
              </div>
            `).join('')}
            <div class="divider"></div>
            <div class="row bold" style="font-size: 14px;">
              <span>TOTAL:</span>
              <span>$${sale.total.toLocaleString('es-AR')}</span>
            </div>
            <div class="row" style="font-size: 10px;">
              <span>Forma de Pago:</span>
              <span class="bold">${sale.paymentMethod}</span>
            </div>
            <div class="divider"></div>
            <div class="text-center" style="margin-top: 6px;">
              <div class="bold" style="font-size: 11px;">CANJEAR EN BARRA</div>
              <div style="font-size: 8px;">Válido únicamente para la noche de emisión</div>
              <div style="letter-spacing: 2px; margin-top: 4px; font-size: 10px;">* ${sale.id} *</div>
            </div>
          </body>
          </html>
        `;

        const printWindow = window.open('', '_blank', 'width=350,height=550');
        if (printWindow) {
          printWindow.document.open();
          printWindow.document.write(printContent);
          printWindow.document.close();
          printWindow.focus();
          setTimeout(() => {
            printWindow.print();
            printWindow.close();
          }, 250);
          return;
        }

        window.print();
      } catch (err) {
        console.error('Error al imprimir ticket térmico:', err);
        window.print();
      }
    }

    // =========================================================================
    // ========================== COMPONENTE PRINCIPAL =========================
    // =========================================================================
    function App() {
      const [firebaseUser, setFirebaseUser] = useState(null);
      const [isLiveConnected, setIsLiveConnected] = useState(false);

      const [session, setSession] = useState(null);
      const [adminTab, setAdminTab] = useState('DASHBOARD');
      const [currentCashierId, setCurrentCashierId] = useState('csh-1');

      const [inventory, setInventory] = useState(INITIAL_INVENTORY);
      const [recipes, setRecipes] = useState(INITIAL_RECIPES);
      const [cashiers, setCashiers] = useState(INITIAL_CASHIERS);
      const [events, setEvents] = useState(INITIAL_EVENTS);
      const [adminPassword, setAdminPassword] = useState('admin123');

      const [salesHistory, setSalesHistory] = useState([]);

      const [purchases, setPurchases] = useState([]);

      // Modales & POS States
      const [showAddCashierModal, setShowAddCashierModal] = useState(false);
      const [showPurchaseModal, setShowPurchaseModal] = useState(false);
      const [purchaseToEdit, setPurchaseToEdit] = useState(null);
      const [showRecipeModal, setShowRecipeModal] = useState(false);
      const [showCloseCashModal, setShowCloseCashModal] = useState(false);
      const [cashierToAssignCash, setCashierToAssignCash] = useState(null);
      const [lastSaleTicket, setLastSaleTicket] = useState(null);
      const [autoPrint, setAutoPrint] = useState(true);
      const [ticketFormat, setTicketFormat] = useState('80mm');
      const [cart, setCart] = useState([]);

      // 1. Control de estado de Firebase y escucha según las reglas
      useEffect(() => {
        let isMounted = true;

        const unsubscribeAuth = auth.onAuthStateChanged((user) => {
          if (!isMounted) return;
          setFirebaseUser(user);
          setIsLiveConnected(true);
        });

        // 2. Suscripción a tickets (abierto para lectura según tus reglas: allow read: if true)
        const unsubSales = db.collection('tickets').doc('tangalagua_pos_sales').onSnapshot(
          (snap) => {
            if (!isMounted || !snap.exists) return;
            const data = snap.data();
            if (data?.items && Array.isArray(data.items)) {
              setSalesHistory(data.items);
            }
          },
          (err) => console.warn('Aviso tickets listener:', err.message)
        );

        return () => {
          isMounted = false;
          unsubscribeAuth();
          unsubSales();
        };
      }, []);

      // 3. Suscripción a colecciones de /settings (Solo cuando el usuario es admin@experienceqr.com)
      useEffect(() => {
        if (!firebaseUser || firebaseUser.email !== 'admin@experienceqr.com') {
          return;
        }

        let isMounted = true;
        const settingsKeys = [
          { key: 'inventory', docId: 'tangalagua_inventory' },
          { key: 'recipes', docId: 'tangalagua_recipes' },
          { key: 'cashiers', docId: 'tangalagua_cashiers' },
          { key: 'purchases', docId: 'tangalagua_purchases' }
        ];

        const unsubs = settingsKeys.map(({ key, docId }) => {
          return db.collection('settings').doc(docId).onSnapshot(
            (snap) => {
              if (!isMounted || !snap.exists) return;
              const data = snap.data();
              if (data?.items && Array.isArray(data.items)) {
                if (key === 'inventory') setInventory(data.items);
                if (key === 'recipes') setRecipes(data.items);
                if (key === 'cashiers') setCashiers(data.items);
                if (key === 'purchases') setPurchases(data.items);
              }
            },
            (err) => console.warn(`Aviso settings/${docId}:`, err.message)
          );
        });

        return () => {
          isMounted = false;
          unsubs.forEach((unsub) => unsub());
        };
      }, [firebaseUser]);

      const activeCashier = useMemo(
        () => cashiers.find((c) => c.id === currentCashierId) || cashiers[0],
        [cashiers, currentCashierId]
      );

      const criticalItems = useMemo(
        () => inventory.filter((item) => item.currentStockMl <= item.minAlertMl),
        [inventory]
      );

      const handleLogout = () => {
        setSession(null);
        setCart([]);
      };

      const handleToggleCashierStatus = (id) => {
        const updated = cashiers.map((c) => (c.id === id ? { ...c, active: !c.active } : c));
        setCashiers(updated);
        syncLiveCollection('cashiers', updated);
      };

      const handleAddCashier = (newCashier) => {
        const updated = [...cashiers, newCashier];
        setCashiers(updated);
        syncLiveCollection('cashiers', updated);
        setShowAddCashierModal(false);
      };

      const handleDeleteCashier = (id) => {
        const remaining = cashiers.filter((c) => c.id !== id);
        if (currentCashierId === id && remaining.length > 0) setCurrentCashierId(remaining[0].id);
        setCashiers(remaining);
        syncLiveCollection('cashiers', remaining);
      };

      const handleUpdateCashierInitialCash = (cashierId, newInitialCash) => {
        const updated = cashiers.map((c) => (c.id === cashierId ? { ...c, initialCash: newInitialCash } : c));
        setCashiers(updated);
        syncLiveCollection('cashiers', updated);
        setCashierToAssignCash(null);
      };

      const handleRegisterConsignmentPayment = (purchaseId, amount) => {
        const updated = purchases.map((p) => {
          if (p.id === purchaseId) {
            const currentPaid = p.paidAmount || 0;
            return { ...p, paidAmount: Math.min(p.totalAmount, currentPaid + amount) };
          }
          return p;
        });
        setPurchases(updated);
        syncLiveCollection('purchases', updated);
      };

      const handleSavePurchase = (invoiceData) => {
        if (purchaseToEdit) {
          const oldPurchase = purchases.find((p) => p.id === purchaseToEdit.id);
          const newInventory = inventory.map((invItem) => {
            let currentStock = invItem.currentStockMl;
            if (oldPurchase) {
              const oldItem = oldPurchase.items.find((bi) => bi.inventoryId === invItem.id);
              if (oldItem) currentStock = Math.max(0, currentStock - oldItem.addedMl);
            }
            const newItem = invoiceData.items.find((bi) => bi.inventoryId === invItem.id);
            if (newItem) {
              currentStock += newItem.addedMl;
              return {
                ...invItem,
                currentStockMl: currentStock,
                costPerBottle: Math.round(newItem.cost / newItem.bottles)
              };
            }
            return { ...invItem, currentStockMl: currentStock };
          });

          const newPurchases = purchases.map((p) => (p.id === purchaseToEdit.id ? { ...invoiceData, id: p.id } : p));
          setInventory(newInventory);
          setPurchases(newPurchases);
          syncLiveCollection('inventory', newInventory);
          syncLiveCollection('purchases', newPurchases);
          setPurchaseToEdit(null);
        } else {
          const newPurchases = [invoiceData, ...purchases];
          const newInventory = inventory.map((invItem) => {
            const boughtItem = invoiceData.items.find((bi) => bi.inventoryId === invItem.id);
            if (boughtItem) {
              return {
                ...invItem,
                currentStockMl: invItem.currentStockMl + boughtItem.addedMl,
                costPerBottle: Math.round(boughtItem.cost / boughtItem.bottles)
              };
            }
            return invItem;
          });

          setPurchases(newPurchases);
          setInventory(newInventory);
          syncLiveCollection('purchases', newPurchases);
          syncLiveCollection('inventory', newInventory);
        }
        setShowPurchaseModal(false);
      };

      const handleDeletePurchase = (purchaseId) => {
        const purchaseToDelete = purchases.find((p) => p.id === purchaseId);
        if (!purchaseToDelete) return;

        const newInventory = inventory.map((invItem) => {
          const itemInPurchase = purchaseToDelete.items.find((bi) => bi.inventoryId === invItem.id);
          if (itemInPurchase) {
            return {
              ...invItem,
              currentStockMl: Math.max(0, invItem.currentStockMl - itemInPurchase.addedMl)
            };
          }
          return invItem;
        });

        const newPurchases = purchases.filter((p) => p.id !== purchaseId);
        setInventory(newInventory);
        setPurchases(newPurchases);
        syncLiveCollection('inventory', newInventory);
        syncLiveCollection('purchases', newPurchases);
      };

      const handleSaveRecipe = (newRecipe) => {
        const updated = [...recipes, newRecipe];
        setRecipes(updated);
        syncLiveCollection('recipes', updated);
        setShowRecipeModal(false);
      };

      const handleAddToCart = (recipe) => {
        setCart((prev) => {
          const existing = prev.find((item) => item.id === recipe.id);
          if (existing) {
            return prev.map((item) => (item.id === recipe.id ? { ...item, qty: item.qty + 1 } : item));
          }
          return [...prev, { ...recipe, qty: 1 }];
        });
      };

      const handleRemoveFromCart = (recipeId) => {
        setCart((prev) =>
          prev
            .map((item) => (item.id === recipeId ? { ...item, qty: item.qty - 1 } : item))
            .filter((item) => item.qty > 0)
        );
      };

      const handleDeleteItemFromCart = (recipeId) => {
        setCart((prev) => prev.filter((item) => item.id !== recipeId));
      };

      const handleProcessSale = (paymentMethod) => {
        if (cart.length === 0) return;

        const stockDeductions = {};
        cart.forEach((cartItem) => {
          cartItem.ingredients.forEach((ing) => {
            const requiredMl = ing.cc * cartItem.qty;
            stockDeductions[ing.inventoryId] = (stockDeductions[ing.inventoryId] || 0) + requiredMl;
          });
        });

        const newInventory = inventory.map((item) => {
          const used = stockDeductions[item.id] || 0;
          return {
            ...item,
            currentStockMl: Math.max(0, item.currentStockMl - used)
          };
        });

        const saleTotal = cart.reduce((acc, it) => acc + it.price * it.qty, 0);
        const newTxId = `tx-${Date.now().toString().slice(-4)}`;
        const nextTicketNum = String(salesHistory.length + 101);

        const newSale = {
          id: newTxId,
          ticketNumber: nextTicketNum,
          cashierId: activeCashier.id,
          cashierName: activeCashier.name,
          station: activeCashier.station,
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          items: cart.map((c) => ({
            name: c.name,
            qty: c.qty,
            price: c.price,
            ingredientsSummary: c.ingredients.map((i) => `${i.cc * c.qty}cc ${i.name}`).join(', ')
          })),
          total: saleTotal,
          paymentMethod
        };

        const newSalesHistory = [newSale, ...salesHistory];
        const newCashiers = cashiers.map((c) =>
          c.id === activeCashier.id ? { ...c, totalSales: (c.totalSales || 0) + saleTotal } : c
        );

        setInventory(newInventory);
        setSalesHistory(newSalesHistory);
        setCashiers(newCashiers);

        syncLiveCollection('inventory', newInventory);
        syncLiveCollection('sales', newSalesHistory);
        syncLiveCollection('cashiers', newCashiers);

        setCart([]);
        setLastSaleTicket(newSale);

        if (autoPrint) {
          triggerThermalPrint(newSale, ticketFormat);
        }
      };

      if (!session) {
        return (
          <LoginScreen
            cashiers={cashiers}
            adminPassword={adminPassword}
            isLiveConnected={isLiveConnected}
            onLoginSuccess={(newSession) => {
              setSession(newSession);
              if (newSession.role === 'CASHIER') {
                setCurrentCashierId(newSession.cashierId);
              }
            }}
          />
        );
      }

      const role = session.role;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans select-none relative">
          {/* Contenedor DOM para impresión */}
          {lastSaleTicket && (
            <div id="active-print-ticket" className="hidden">
              {generateTicketHtml(lastSaleTicket, ticketFormat)}
            </div>
          )}

          {/* Top Header */}
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-black text-xl shadow-lg shadow-purple-600/30">
                ⚡
              </div>
              <div>
                <h1 className="text-lg font-black tracking-tight text-white flex items-center gap-2">
                  TANGALAGUA <span className="text-xs bg-purple-950 text-purple-400 border border-purple-800 px-2 py-0.5 rounded-full font-bold">CONTROL DE BARRA</span>
                </h1>
                <p className="text-xs text-slate-400">Descuento milimétrico en CC & Facturación Mayorista</p>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2">
                <div
                  className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-xl border ${
                    isLiveConnected
                      ? 'bg-emerald-950/80 border-emerald-600/70 text-emerald-400'
                      : 'bg-amber-950/80 border-amber-600/70 text-amber-300'
                  }`}
                >
                  <Icons.Radio className={`w-3.5 h-3.5 ${isLiveConnected ? 'text-emerald-400 animate-pulse' : 'text-amber-400'}`} />
                  <span className="hidden sm:inline">
                    {isLiveConnected ? 'Firebase En Vivo' : 'Conectando a Firebase...'}
                  </span>
                </div>

                <span
                  className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-xl border ${
                    role === 'ADMIN'
                      ? 'bg-purple-950/80 border-purple-600 text-purple-300'
                      : 'bg-emerald-950/80 border-emerald-600 text-emerald-300'
                  }`}
                >
                  {role === 'ADMIN' ? (
                    <>
                      <Icons.ShieldCheck className="w-4 h-4 text-purple-400" />
                      <span>Administrador</span>
                    </>
                  ) : (
                    <>
                      <Icons.DollarSign className="w-4 h-4 text-emerald-400" />
                      <span>{activeCashier?.name} ({activeCashier?.station})</span>
                    </>
                  )}
                </span>

                <button
                  onClick={handleLogout}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-800 hover:bg-rose-950/60 text-slate-300 hover:text-rose-300 border border-slate-700 hover:border-rose-700/50 transition-all"
                  title="Cerrar Sesión"
                >
                  <Icons.LogOut className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Salir</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          {role === 'ADMIN' ? (
            <div className="flex-1 flex overflow-hidden">
              {/* Sidebar Navegación */}
              <aside className="w-64 bg-slate-900/80 border-r border-slate-800 p-4 shrink-0 flex flex-col justify-between">
                <nav className="space-y-1.5">
                  <SidebarBtn
                    active={adminTab === 'DASHBOARD'}
                    onClick={() => setAdminTab('DASHBOARD')}
                    icon={<Icons.BarChart3 className="w-5 h-5" />}
                    label="Tablero Principal"
                  />
                  <SidebarBtn
                    active={adminTab === 'ANALYTICS'}
                    onClick={() => setAdminTab('ANALYTICS')}
                    icon={<Icons.TrendingUp className="w-5 h-5" />}
                    label="Estadísticas & Gráficos"
                  />
                  <SidebarBtn
                    active={adminTab === 'CONSIGNMENT'}
                    onClick={() => setAdminTab('CONSIGNMENT')}
                    icon={<Icons.Handshake className="w-5 h-5" />}
                    label="Consignación & Eventos"
                    badge={purchases.filter((p) => p.isConsignment && (p.paidAmount || 0) < p.totalAmount).length}
                  />
                  <SidebarBtn
                    active={adminTab === 'CONSIGNMENT_STOCK'}
                    onClick={() => setAdminTab('CONSIGNMENT_STOCK')}
                    icon={<Icons.PieChart className="w-5 h-5" />}
                    label="Stock s/ Consignación"
                  />
                  <SidebarBtn
                    active={adminTab === 'CASHIERS'}
                    onClick={() => setAdminTab('CASHIERS')}
                    icon={<Icons.Users className="w-5 h-5" />}
                    label="Gestión de Cajeros"
                    badge={cashiers.filter((c) => c.active).length}
                  />
                  <SidebarBtn
                    active={adminTab === 'PURCHASES'}
                    onClick={() => setAdminTab('PURCHASES')}
                    icon={<Icons.Receipt className="w-5 h-5" />}
                    label="Facturación & Compras"
                  />
                  <SidebarBtn
                    active={adminTab === 'RECIPES'}
                    onClick={() => setAdminTab('RECIPES')}
                    icon={<Icons.Layers className="w-5 h-5" />}
                    label="Escandallos / Recetas"
                    badge={recipes.length}
                  />
                  <SidebarBtn
                    active={adminTab === 'INVENTORY'}
                    onClick={() => setAdminTab('INVENTORY')}
                    icon={<Icons.Package className="w-5 h-5" />}
                    label="Control de Stock (cc)"
                    alertCount={criticalItems.length}
                  />
                </nav>

                <div className="p-3 bg-purple-950/40 border border-purple-800/40 rounded-xl text-xs space-y-1">
                  <div className="flex items-center gap-1.5 text-purple-300 font-bold">
                    <Icons.Printer className="w-3.5 h-3.5" /> Impresora Térmica
                  </div>
                  <p className="text-slate-400 text-[11px]">Salida configurada para corte en {ticketFormat}.</p>
                </div>
              </aside>

              {/* Contenido Principal Admin */}
              <main className="flex-1 overflow-y-auto p-6 bg-slate-950">
                {adminTab === 'DASHBOARD' && (
                  <DashboardView
                    inventory={inventory}
                    salesHistory={salesHistory}
                    cashiers={cashiers}
                    recipes={recipes}
                    onNavigate={(tab) => setAdminTab(tab)}
                  />
                )}
                {adminTab === 'ANALYTICS' && (
                  <AnalyticsView
                    salesHistory={salesHistory}
                    purchases={purchases}
                    cashiers={cashiers}
                    recipes={recipes}
                  />
                )}
                {adminTab === 'CONSIGNMENT' && (
                  <ConsignmentView
                    purchases={purchases}
                    inventory={inventory}
                    recipes={recipes}
                    salesHistory={salesHistory}
                    events={events}
                    onRegisterPayment={handleRegisterConsignmentPayment}
                  />
                )}
                {adminTab === 'CONSIGNMENT_STOCK' && (
                  <ConsignmentStockView
                    purchases={purchases}
                    inventory={inventory}
                    recipes={recipes}
                    salesHistory={salesHistory}
                    events={events}
                  />
                )}
                {adminTab === 'CASHIERS' && (
                  <CashiersView
                    cashiers={cashiers}
                    onToggleStatus={handleToggleCashierStatus}
                    onDeleteCashier={handleDeleteCashier}
                    onOpenCreateModal={() => setShowAddCashierModal(true)}
                    onOpenAssignCashModal={(cashier) => setCashierToAssignCash(cashier)}
                  />
                )}
                {adminTab === 'PURCHASES' && (
                  <PurchasesView
                    purchases={purchases}
                    inventory={inventory}
                    onOpenPurchaseModal={() => {
                      setPurchaseToEdit(null);
                      setShowPurchaseModal(true);
                    }}
                    onEditPurchase={(purchase) => {
                      setPurchaseToEdit(purchase);
                      setShowPurchaseModal(true);
                    }}
                    onDeletePurchase={handleDeletePurchase}
                  />
                )}
                {adminTab === 'RECIPES' && (
                  <RecipesView
                    recipes={recipes}
                    inventory={inventory}
                    onOpenRecipeModal={() => setShowRecipeModal(true)}
                  />
                )}
                {adminTab === 'INVENTORY' && (
                  <InventoryView
                    inventory={inventory}
                    salesHistory={salesHistory}
                    recipes={recipes}
                    purchases={purchases}
                    criticalItems={criticalItems}
                    onOpenRestockModal={() => setShowPurchaseModal(true)}
                    onUpdateStock={(itemId, deltaMl) => {
                      const updated = inventory.map((inv) =>
                        inv.id === itemId
                          ? { ...inv, currentStockMl: Math.max(0, inv.currentStockMl + deltaMl) }
                          : inv
                      );
                      setInventory(updated);
                      syncLiveCollection('inventory', updated);
                    }}
                  />
                )}
              </main>
            </div>
          ) : (
            <CashierPosView
              activeCashier={activeCashier}
              salesHistory={salesHistory}
              recipes={recipes}
              inventory={inventory}
              cart={cart}
              onAddToCart={handleAddToCart}
              onRemoveFromCart={handleRemoveFromCart}
              onDeleteItemFromCart={handleDeleteItemFromCart}
              onClearCart={() => setCart([])}
              onProcessSale={handleProcessSale}
              autoPrint={autoPrint}
              onToggleAutoPrint={() => setAutoPrint((prev) => !prev)}
              ticketFormat={ticketFormat}
              onChangeTicketFormat={setTicketFormat}
              onOpenCloseCashModal={() => setShowCloseCashModal(true)}
            />
          )}

          {/* Modales Globales */}
          {showAddCashierModal && (
            <AddCashierModal
              onClose={() => setShowAddCashierModal(false)}
              onAdd={handleAddCashier}
            />
          )}
          {cashierToAssignCash && (
            <AssignCashModal
              cashier={cashierToAssignCash}
              onClose={() => setCashierToAssignCash(null)}
              onConfirm={(amount) => handleUpdateCashierInitialCash(cashierToAssignCash.id, amount)}
            />
          )}
          {showPurchaseModal && (
            <PurchaseInvoiceModal
              inventory={inventory}
              initialData={purchaseToEdit}
              onClose={() => {
                setShowPurchaseModal(false);
                setPurchaseToEdit(null);
              }}
              onSave={handleSavePurchase}
            />
          )}
          {showRecipeModal && (
            <RecipeModal
              inventory={inventory}
              onClose={() => setShowRecipeModal(false)}
              onSave={handleSaveRecipe}
            />
          )}
          {showCloseCashModal && activeCashier && (
            <CloseCashModal
              cashier={activeCashier}
              salesHistory={salesHistory.filter((s) => s.cashierId === activeCashier.id)}
              onClose={() => setShowCloseCashModal(false)}
            />
          )}
          {lastSaleTicket && (
            <PrintConfirmationModal
              sale={lastSaleTicket}
              ticketFormat={ticketFormat}
              onClose={() => setLastSaleTicket(null)}
              onReprint={() => triggerThermalPrint(lastSaleTicket, ticketFormat)}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // ============================= LOGIN VIEW ================================
    // =========================================================================
    function LoginScreen({ cashiers, adminPassword, isLiveConnected, onLoginSuccess }) {
      const [tab, setTab] = useState('CASHIER');
      const [dniInput, setDniInput] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [adminEmailInput, setAdminEmailInput] = useState('admin@experienceqr.com');
      const [adminPassInput, setAdminPassInput] = useState('');
      const [isLoadingAuth, setIsLoadingAuth] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const normalizeDni = (str) => str.replace(/[^0-9]/g, '');

      const handleCashierLogin = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const cleanDni = normalizeDni(dniInput);
        if (!cleanDni) {
          setErrorMsg('Por favor ingrese su número de DNI');
          return;
        }

        const found = cashiers.find((c) => normalizeDni(c.dni) === cleanDni);
        if (!found) {
          setErrorMsg('DNI no registrado como cajero del boliche.');
          return;
        }
        if (!found.active) {
          setErrorMsg('Este cajero se encuentra desactivado por administración.');
          return;
        }
        if (pinInput.trim() !== (found.pin || '1234').trim()) {
          setErrorMsg('PIN incorrecto para este cajero.');
          return;
        }

        onLoginSuccess({ role: 'CASHIER', cashierId: found.id });
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setIsLoadingAuth(true);

        const emailTrimmed = adminEmailInput.trim();
        const passTrimmed = adminPassInput.trim();

        if (passTrimmed === adminPassword.trim()) {
          setIsLoadingAuth(false);
          onLoginSuccess({ role: 'ADMIN', provider: 'LOCAL_MASTER' });
          return;
        }

        if (!emailTrimmed) {
          setIsLoadingAuth(false);
          setErrorMsg('Ingrese el correo electrónico de Firebase.');
          return;
        }

        try {
          const userCredential = await auth.signInWithEmailAndPassword(emailTrimmed, passTrimmed);
          setIsLoadingAuth(false);
          onLoginSuccess({
            role: 'ADMIN',
            email: userCredential.user.email,
            uid: userCredential.user.uid,
            provider: 'FIREBASE_AUTH'
          });
        } catch (firebaseErr) {
          setIsLoadingAuth(false);
          const errCode = firebaseErr.message || '';
          if (errCode.includes('auth/wrong-password') || errCode.includes('auth/invalid-credential')) {
            setErrorMsg('Contraseña incorrecta para admin@experienceqr.com.');
          } else if (errCode.includes('PASSWORD_LOGIN_DISABLED') || errCode.includes('operation-not-allowed')) {
            setErrorMsg('En Firebase Console activa el proveedor Email/Password en Sign-in method.');
          } else {
            setErrorMsg(`Error de inicio de sesión: ${errCode}`);
          }
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
          <div className="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm">
            <div className="text-center mb-6">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-black text-2xl shadow-xl shadow-purple-600/30 mx-auto mb-3">
                ⚡
              </div>
              <h1 className="text-2xl font-black tracking-tight text-white">TANGALAGUA</h1>
              <p className="text-xs text-slate-400 mt-1">Control de Barras & Facturación Mayorista</p>
              <div className="mt-2.5 flex items-center justify-center gap-1.5">
                <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border ${isLiveConnected ? 'bg-emerald-950/80 border-emerald-700/60 text-emerald-300' : 'bg-amber-950/80 border-amber-700/60 text-amber-300'}`}>
                  <Icons.Radio className={`w-3.5 h-3.5 ${isLiveConnected ? 'text-emerald-400 animate-pulse' : 'text-amber-400'}`} />
                  <span>{isLiveConnected ? 'Firebase En Vivo' : 'Conectando con Firebase...'}</span>
                </span>
              </div>
            </div>

            <div className="flex bg-slate-950 p-1 rounded-2xl border border-slate-800 mb-6">
              <button
                type="button"
                onClick={() => { setTab('CASHIER'); setErrorMsg(''); }}
                className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2 ${tab === 'CASHIER' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                <Icons.DollarSign className="w-4 h-4" /> Cajero (DNI + PIN)
              </button>
              <button
                type="button"
                onClick={() => { setTab('ADMIN'); setErrorMsg(''); }}
                className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2 ${tab === 'ADMIN' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                <Icons.ShieldCheck className="w-4 h-4" /> Administrativo
              </button>
            </div>

            {errorMsg && (
              <div className="mb-4 p-3 bg-rose-500/15 border border-rose-500/30 rounded-xl text-rose-300 text-xs flex items-start gap-2">
                <Icons.AlertTriangle className="w-4 h-4 shrink-0 text-rose-400 mt-0.5" />
                <div className="leading-snug">{errorMsg}</div>
              </div>
            )}

            {tab === 'CASHIER' ? (
              <form onSubmit={handleCashierLogin} className="space-y-4 text-xs">
                <div>
                  <label className="block text-slate-300 font-semibold mb-1.5">DNI del Cajero</label>
                  <input
                    type="text"
                    required
                    value={dniInput}
                    onChange={(e) => setDniInput(e.target.value)}
                    placeholder="Ingrese DNI"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-white text-sm outline-none focus:border-emerald-500 font-mono"
                  />
                  <p className="text-[10px] text-slate-500 mt-1">
                    Ingrese con el DNI registrado por administración.
                  </p>
                </div>
                <div>
                  <label className="block text-slate-300 font-semibold mb-1.5">PIN de Barra</label>
                  <input
                    type="password"
                    required
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    placeholder="••••"
                    maxLength={10}

    // =========================================================================
    // ============================= ANALYTICS VIEW ============================
    // =========================================================================
    function AnalyticsView({ salesHistory, purchases, cashiers, recipes }) {
      const drinkRanking = useMemo(() => {
        const counts = {};
        salesHistory.forEach((sale) => {
          sale.items.forEach((item) => {
            counts[item.name] = (counts[item.name] || 0) + item.qty;
          });
        });
        const list = Object.entries(counts).map(([name, count]) => {
          const rec = recipes.find((r) => r.name === name);
          const price = rec ? rec.price : 6000;
          return { name, count, revenue: count * price, category: rec?.category || 'Trago' };
        });
        list.sort((a, b) => b.count - a.count);
        return list;
      }, [salesHistory, recipes]);

      const maxDrinkCount = drinkRanking[0]?.count || 1;
      const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

      const cashByMonth = useMemo(() => {
        return months.map((m, idx) => {
          const total = Math.round(540000 + (Math.sin(idx + 1) + 1) * 320000);
          return { month: m, total };
        });
      }, []);

      const maxMonthTotal = Math.max(...cashByMonth.map((c) => c.total), 800000);

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-black text-white">Estadísticas & Gráficos</h2>
            <p className="text-xs text-slate-400">Métricas analíticas de despacho, cajas mensuales y compras vs ventas</p>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h3 className="text-sm font-bold text-white mb-4 flex items-center gap-2">
              <Icons.TrendingUp className="w-4 h-4 text-purple-400" /> Bebidas Más Vendidas
            </h3>
            <div className="space-y-3">
              {drinkRanking.map((item, idx) => {
                const pct = Math.round((item.count / maxDrinkCount) * 100);
                return (
                  <div key={idx} className="space-y-1">
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-bold text-slate-200">
                        <span className="text-purple-400 font-mono mr-2">#{idx + 1}</span>
                        {item.name}
                      </span>
                      <div className="flex items-center gap-3 font-mono">
                        <span className="text-purple-300 font-bold">{item.count} vasos</span>
                        <span className="text-emerald-400 font-bold">${item.revenue.toLocaleString('es-AR')}</span>
                      </div>
                    </div>
                    <div className="w-full h-3 bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-800">
                      <div className="h-full bg-gradient-to-r from-purple-600 to-pink-500 rounded-full" style={{ width: `${pct}%` }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h3 className="text-sm font-bold text-white mb-4 flex items-center gap-2">
              <Icons.BarChart3 className="w-4 h-4 text-emerald-400" /> Histograma de Recaudación Mensual
            </h3>
            <div className="h-48 flex items-end justify-between gap-1 pt-6 px-2 border-b border-slate-800">
              {cashByMonth.map((col, idx) => {
                const hPct = Math.round((col.total / maxMonthTotal) * 100);
                return (
                  <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group">
                    <div className="w-full max-w-[24px] bg-gradient-to-t from-emerald-600 to-teal-400 rounded-t-md" style={{ height: `${hPct}%` }} />
                    <span className="text-[9px] text-slate-400 mt-2 font-mono">{col.month}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="text-slate-400 border-b border-slate-800 font-semibold">
                          <th className="pb-2">Artículo</th>
                          <th className="pb-2">Stock Real (Factura)</th>
                          <th className="pb-2 text-center">Consumido (A Pagar)</th>
                          <th className="pb-2 text-center">Stock Sobrante</th>
                          <th className="pb-2 text-right">Costo a Liquidar</th>

                      </thead>
                      <tbody className="divide-y divide-slate-800/60 font-mono">
                        {purchase.items.map((item, idx) => {

    function ConsignmentPaymentModal({ purchase, onClose, onConfirm }) {

      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">

    // =========================================================================
    // ==================== CONSIGNMENT STOCK VIEW =============================
    // =========================================================================
    function ConsignmentStockView({ purchases, inventory, recipes, salesHistory, events }) {
      const consignmentPurchases = useMemo(() => purchases.filter((p) => p.isConsignment === true), [purchases]);

      const aggregatedStock = useMemo(() => {
        const map = {};
        consignmentPurchases.forEach((p) => {
          p.items.forEach((item) => {
            if (!map[item.name]) {
              map[item.name] = {
                name: item.name,
                bottleSizeMl: item.bottleSizeMl,
                costPerBottle: item.costPerBottle,
                totalBottlesBilled: 0,
                totalBottlesConsumed: 0
              };
            }
            map[item.name].totalBottlesBilled += item.bottles;
            map[item.name].totalBottlesConsumed += Math.round(item.bottles * 0.45);
          });
        });

        return Object.values(map).map((entry) => {
          const remainingBottles = Math.max(0, entry.totalBottlesBilled - entry.totalBottlesConsumed);
          const remainingMl = remainingBottles * entry.bottleSizeMl;
          const valuation = remainingBottles * entry.costPerBottle;
          return { ...entry, remainingBottles, remainingMl, valuation };
        });
      }, [consignmentPurchases]);

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-black text-white">Stock según Consignación</h2>

    function PurchaseInvoiceModal({ inventory, initialData, onClose, onSave }) {
      const [invoiceNumber, setInvoiceNumber] = useState(initialData?.invoiceNumber || '');
      const [supplier, setSupplier] = useState(initialData?.supplier || '');
      const [date, setDate] = useState(initialData?.date || new Date().toISOString().split('T')[0]);
      const [isConsignment, setIsConsignment] = useState(initialData?.isConsignment || false);
      const [selectedInvId, setSelectedInvId] = useState(inventory[0]?.id || '');
      const [bottles, setBottles] = useState(6);
      const [cost, setCost] = useState(50000);
      const [items, setItems] = useState(initialData?.items || []);

      const handleAddItem = () => {
        const inv = inventory.find((i) => i.id === selectedInvId);
        if (!inv) return;
        const bCount = parseInt(bottles) || 1;
        const cTotal = parseFloat(cost) || 0;
        setItems([...items, {
          inventoryId: inv.id,
          name: inv.name,
          bottles: bCount,
          bottleSizeMl: inv.bottleSizeMl,
          addedMl: bCount * inv.bottleSizeMl,
          cost: cTotal,
          costPerBottle: Math.round(cTotal / bCount)
        }]);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (items.length === 0 || !invoiceNumber || !supplier) return;
        const totalAmount = items.reduce((acc, i) => acc + i.cost, 0);
        onSave({
          id: initialData?.id || `fac-${Date.now().toString().slice(-4)}`,
          date,
          invoiceNumber,
          supplier,
          isConsignment,
          paidAmount: initialData ? initialData.paidAmount : isConsignment ? 0 : totalAmount,
          totalAmount,
          items
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 className="text-base font-black text-white mb-4">{initialData ? 'Editar Factura' : 'Registrar Factura Mayorista'}</h3>
            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <input type="text" required placeholder="N° Factura" value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono" />
                <input type="date" required value={date} onChange={(e) => setDate(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
              </div>
              <input type="text" required placeholder="Proveedor Mayorista" value={supplier} onChange={(e) => setSupplier(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />

              <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 grid grid-cols-2 gap-2">
                <button type="button" onClick={() => setIsConsignment(true)} className={`py-2 rounded-lg font-bold text-xs ${isConsignment ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}`}>En Consignación</button>
                <button type="button" onClick={() => setIsConsignment(false)} className={`py-2 rounded-lg font-bold text-xs ${!isConsignment ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400'}`}>Compra Directa</button>
              </div>

              <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                <span className="font-bold text-white">Agregar Bebidas:</span>
                <div className="grid grid-cols-3 gap-2">
                  <select value={selectedInvId} onChange={(e) => setSelectedInvId(e.target.value)} className="bg-slate-900 border border-slate-800 text-white rounded-xl px-2 py-2 text-xs">
                    {inventory.map((inv) => <option key={inv.id} value={inv.id}>{inv.name}</option>)}
                  </select>
                  <input type="number" min="1" value={bottles} onChange={(e) => setBottles(e.target.value)} placeholder="Botellas" className="bg-slate-900 border border-slate-800 text-white rounded-xl px-2 py-2 font-mono" />
                  <input type="number" min="0" value={cost} onChange={(e) => setCost(e.target.value)} placeholder="Costo Total" className="bg-slate-900 border border-slate-800 text-white rounded-xl px-2 py-2 font-mono" />
                </div>
                <button type="button" onClick={handleAddItem} className="w-full py-2 rounded-xl bg-slate-850 text-purple-300 font-bold border border-purple-800/40">+ Agregar Ítem</button>
              </div>

              {items.map((it, idx) => (
                <div key={idx} className="flex justify-between items-center p-2 rounded-lg bg-slate-950 border border-slate-800">
                  <span className="text-white font-bold">{it.name} ({it.bottles} bot.)</span>
                  <div className="flex items-center gap-2">
                    <span className="text-emerald-400 font-mono font-bold">${it.cost.toLocaleString('es-AR')}</span>

                  </div>
                </div>
              ))}

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                <button type="submit" disabled={items.length === 0} className="flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 disabled:opacity-40 text-white font-black shadow-lg">Guardar Factura</button>
